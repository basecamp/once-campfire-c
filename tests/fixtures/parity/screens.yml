# ================================================================================================
# Real time: two (or three) browser contexts; the captured one is B
# ================================================================================================

- id: realtime/message_sent
  actors: { a: jason, b: david }
  capture: b
  path: /rooms/{{rooms.designers}}
  mutates: true
  steps:
    - { actor: a, type: { selector: "#composer .lexxy-editor__content", text: "Live from Jason" } }
    - { actor: a, click: "#composer button[name=send]" }
    - { actor: b, wait_for: '.message:has-text("Live from Jason")' }
  covers: [messages/_message]

- id: realtime/attachment_sent
  actors: { a: jason, b: david }
  capture: b
  path: /rooms/{{rooms.designers}}
  mutates: true
  steps:
    - { actor: a, upload: { selector: "#composer input[type=file]", files: [reference/test/fixtures/files/moon.jpg] } }
    - { actor: a, click: "#composer button[name=send]" }
    - { actor: b, wait_for: '.message:last-child .message__attachment' }
  covers: [messages/_message, messages/_presentation]

- id: realtime/message_edited
  actors: { a: david, b: kevin }
  capture: b
  path: /rooms/{{rooms.designers}}/@{{messages.edited}}
  mutates: true
  steps:
    - { actor: a, click: '[data-message-id="{{messages.edited}}"] .message__options-btn' }
    - { actor: a, click: '[data-message-id="{{messages.edited}}"] .message__edit-btn' }
    - { actor: a, type: { selector: '[data-message-id="{{messages.edited}}"] .lexxy-editor__content', text: " Really." } }
    - { actor: a, click: '[data-message-id="{{messages.edited}}"] .message__edit-btns button[type=submit].btn--reversed' }
    - { actor: b, wait_for: '[data-message-id="{{messages.edited}}"]:has-text("Really.")' }
  covers: [messages/_presentation]

- id: realtime/message_deleted
  actors: { a: david, b: kevin }
  capture: b
  path: /rooms/{{rooms.designers}}/@{{messages.edited}}
  mutates: true
  accept_dialogs: true
  steps:
    - { actor: a, click: '[data-message-id="{{messages.edited}}"] .message__options-btn' }
    - { actor: a, click: '[data-message-id="{{messages.edited}}"] .message__edit-btn' }
    - { actor: a, click: '[data-message-id="{{messages.edited}}"] .message__edit-btns .btn--negative' }
    - { actor: b, wait_for: 'body:not(:has([data-message-id="{{messages.edited}}"]))' }
  covers: []

- id: realtime/boosted
  actors: { a: jason, b: david }
  capture: b
  path: /rooms/{{rooms.designers}}/@{{messages.unboosted}}
  mutates: true
  steps:
    - { actor: a, click: '[data-message-id="{{messages.unboosted}}"] .message__options-btn' }
    - { actor: a, click: '[data-message-id="{{messages.unboosted}}"] .quick-boosts button[data-emoji]' }
    - { actor: b, wait_for: '[data-message-id="{{messages.unboosted}}"] .boost-item' }
  covers: [messages/boosts/_boost]

- id: realtime/boost_removed
  actors: { a: david, b: kevin }
  capture: b
  path: /rooms/{{rooms.designers}}/@{{messages.boosted_by_david}}
  mutates: true
  steps:
    - { actor: a, click: '#boost_{{boosts.david_on_boosted_by_david}} [data-boost-delete-target=content]' }
    - { actor: a, click: '#boost_{{boosts.david_on_boosted_by_david}} .boost__delete' }
    - { actor: b, wait_for: 'body:not(:has(#boost_{{boosts.david_on_boosted_by_david}}))' }
  covers: []

- id: realtime/typing/one
  actors: { a: jason, b: david }
  capture: b
  path: /rooms/{{rooms.designers}}
  mutates: true   # Jason's typing broadcasts reach every capture with designers open
  steps:
    - { actor: a, type: { selector: "#composer .lexxy-editor__content", text: "Thinking" } }
    - { actor: b, wait_for: ".typing-indicator--active" }
    - pause_animations_at: 0
  covers: [rooms/show/_composer]

- id: realtime/typing/many
  actors: { a: jason, c: jz, b: david }
  capture: b
  path: /rooms/{{rooms.designers}}
  mutates: true   # Jason's typing broadcasts reach every capture with designers open
  steps:
    - { actor: a, type: { selector: "#composer .lexxy-editor__content", text: "Thinking" } }
    - { actor: c, type: { selector: "#composer .lexxy-editor__content", text: "Me too" } }
    - { actor: b, wait_for: ".typing-indicator--active" }
    - pause_animations_at: 0
  covers: [rooms/show/_composer]

- id: realtime/unread_in_sidebar
  actors: { a: jason, b: david }
  capture: b
  path: /rooms/{{rooms.designers}}
  mutates: true
  steps:
    - { actor: a, goto: "/rooms/{{rooms.pets}}" }
    - { actor: a, type: { selector: "#composer .lexxy-editor__content", text: "Pets news" } }
    - { actor: a, click: "#composer button[name=send]" }
    - { actor: b, wait_for: '#user_sidebar [data-room-id="{{rooms.pets}}"].unread' }
  covers: [users/sidebars/rooms/_shared]

- id: realtime/new_room_in_sidebar
  actors: { a: david, b: kevin }
  capture: b
  path: /rooms/{{rooms.designers}}
  mutates: true
  steps:
    - { actor: a, goto: /rooms/opens/new }
    - { actor: a, fill: { selector: "#room_name", text: "Launch" } }
    - { actor: a, click: "form button[type=submit].btn--reversed" }
    - { actor: b, wait_for: '#user_sidebar #shared_rooms a:has-text("Launch")' }
  covers: [users/sidebars/rooms/_shared]

- id: realtime/removed_from_room
  actors: { a: david, b: kevin }
  capture: b
  path: /rooms/{{rooms.designers}}
  mutates: true
  # Losing the membership closes Kevin's cable connection (Membership after_destroy_commit ->
  # reset_remote_connections); ActionCable's ConnectionMonitor reconnects once its Date-based
  # staleness check says so, which a frozen Date never does.
  clock: advancing
  steps:
    - { actor: a, goto: "/rooms/closeds/{{rooms.designers}}/edit" }
    - { actor: a, click: 'li[data-value="kevin"] label.switch' }
    - { actor: a, click: "form button[type=submit].btn--reversed" }
    - { actor: b, wait_for: '#user_sidebar:not(:has([data-room-id="{{rooms.designers}}"]))' }
  covers: []

- id: realtime/room_deleted_then_send
  actors: { a: kevin, b: david }
  capture: b
  path: /rooms/{{rooms.quiet}}
  mutates: true
  accept_dialogs: true
  steps:
    - { actor: a, goto: "/rooms/closeds/{{rooms.quiet}}/edit" }
    - { actor: a, click: 'button[aria-label^="Delete"]' }
    - { actor: b, type: { selector: "#composer .lexxy-editor__content", text: "Anyone here?" } }
    - { actor: b, click: "#composer button[name=send]" }
    - { actor: b, wait_for: "#composer-frame .shake" }
  covers: [messages/room_not_found]

- id: realtime/presence_read
  actors: { a: jason, b: david }
  capture: b
  path: /rooms/{{rooms.watercooler}}
  mutates: true
  steps:
    - { actor: a, type: { selector: "#composer .lexxy-editor__content", text: "You are here" } }
    - { actor: a, click: "#composer button[name=send]" }
    - { actor: b, wait_for: '.message:has-text("You are here")' }
  covers: [messages/_message]

# ================================================================================================
# Bot API responses (JSON). Not screens: compared as fragments.
# ================================================================================================

- id: bot_api/messages/index
  kind: fragment
  path: /rooms/{{rooms.watercooler}}/{{bot_keys.bender}}/messages
  covers: [messages/by_bots/index.json, messages/_message.json, users/_user.json]

- id: bot_api/messages/index/before
  kind: fragment
  path: /rooms/{{rooms.watercooler}}/{{bot_keys.bender}}/messages?before={{messages.busy_060}}
  covers: [messages/by_bots/index.json, messages/_message.json]

- id: bot_api/messages/update
  kind: fragment
  mutates: true
  path: /rooms/{{rooms.watercooler}}/{{bot_keys.bender}}/messages/{{messages.bot_in_watercooler}}
  request: { method: PUT, headers: { Content-Type: "application/json" }, body: '{"message":{"body":"Build 1043 passed (edited)"}}' }
  covers: [messages/by_bots/show.json, messages/_message.json, users/_user.json]

- id: bot_api/boosts/create
  kind: fragment
  mutates: true
  expect_status: 201
  path: /rooms/{{rooms.watercooler}}/{{bot_keys.bender}}/messages/{{messages.thirteenth}}/boosts
  request: { method: POST, headers: { Content-Type: "text/plain" }, body: "🤖" }
  covers: [messages/boosts/by_bots/show.json, messages/boosts/_boost.json, users/_user.json]
