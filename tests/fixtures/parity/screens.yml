# lib/autocomplete/base_autocomplete_handler.js asks for JSON only in the Rust app's override: Rails
# answers its plain fetch with HTML and the suggestion list stays empty, so there's no Rails page to
# compare the new-ping suggestions with.

- id: interactions/notifications_help
  as: david
  path: /rooms/{{rooms.designers}}
  steps:
    # With notification permission denied, the bell opens the help dialog
    - click: "[data-notifications-target=bell]"
    - wait_for: "dialog[data-notifications-target=notAllowedNotice][open]"
  covers: [rooms/involvements/_bell, pwa/_browser_settings, pwa/_system_settings, pwa/_install_instructions]

- id: interactions/pwa_install/default
  as: david
  path: /users/me/profile
  user_agent: safari_mac
  steps:
    - click: ".pwa__instructions summary"
  covers: [pwa/_install_instructions]

# PWA install instructions (profile page) and notification help (the bell's dialog), per platform.
# The server picks the branch from the User-Agent (ApplicationPlatform); see parity/seeds/README.md.

- { id: pwa/install/safari_mac,      as: david, path: /users/me/profile, user_agent: safari_mac,      steps: [ { click: ".pwa__instructions summary" } ], covers: [pwa/_install_instructions] }
- { id: pwa/install/safari_ios,      as: david, path: /users/me/profile, user_agent: safari_ios,      matrix: { viewports: [phone] }, steps: [ { click: ".pwa__instructions summary" } ], covers: [pwa/_install_instructions] }
# Reference bug, reproduced on purpose: the Edge branch of pwa/_install_instructions references
# install-edge.svg, which isn't in app/assets, so any page rendering it answers 500.
- { id: pwa/install/firefox_android, as: david, path: /users/me/profile, user_agent: firefox_android, matrix: { viewports: [phone] }, steps: [ { click: ".pwa__instructions summary" } ], covers: [pwa/_install_instructions] }
- { id: pwa/install/opera_linux,     as: david, path: /users/me/profile, user_agent: opera_linux,     steps: [ { click: ".pwa__instructions summary" } ], covers: [pwa/_install_instructions] }
- { id: pwa/install/absent_chrome,   as: david, path: /users/me/profile, user_agent: chrome_mac,      covers: [pwa/_install_instructions] }
- { id: pwa/install/absent_firefox,  as: david, path: /users/me/profile, user_agent: firefox_mac,     covers: [pwa/_install_instructions] }

- { id: pwa/notifications_help/chrome_mac,      as: david, path: "/rooms/{{rooms.designers}}", user_agent: chrome_mac,      steps: [ { click: "[data-notifications-target=bell]" }, { click: "dialog[open] details.notifications-help:not(.hide-in-browser) summary" } ], covers: [pwa/_browser_settings, pwa/_system_settings] }
- { id: pwa/notifications_help/chrome_windows,  as: david, path: "/rooms/{{rooms.designers}}", user_agent: chrome_windows,  steps: [ { click: "[data-notifications-target=bell]" }, { click: "dialog[open] details.notifications-help:not(.hide-in-browser) summary" } ], covers: [pwa/_browser_settings, pwa/_system_settings] }
- { id: pwa/notifications_help/chrome_android,  as: david, path: "/rooms/{{rooms.designers}}", user_agent: chrome_android,  matrix: { viewports: [phone] }, steps: [ { click: "[data-notifications-target=bell]" }, { click: "dialog[open] details.notifications-help:not(.hide-in-browser) summary" } ], covers: [pwa/_browser_settings, pwa/_system_settings, pwa/_install_instructions] }
# Chrome on iOS gets no visible help at all: _browser_settings skips iOS, _install_instructions
# skips every Chrome, and _system_settings is hidden in the browser.
- { id: pwa/notifications_help/chrome_ios,      as: david, path: "/rooms/{{rooms.designers}}", user_agent: chrome_ios,      matrix: { viewports: [phone] }, steps: [ { click: "[data-notifications-target=bell]" }, { wait_for: "dialog[open]" } ], covers: [pwa/_browser_settings, pwa/_system_settings, pwa/_install_instructions] }
- { id: pwa/notifications_help/safari_mac,      as: david, path: "/rooms/{{rooms.designers}}", user_agent: safari_mac,      steps: [ { click: "[data-notifications-target=bell]" }, { click: "dialog[open] details.notifications-help:not(.hide-in-browser) summary" } ], covers: [pwa/_browser_settings, pwa/_system_settings] }
- { id: pwa/notifications_help/safari_ios,      as: david, path: "/rooms/{{rooms.designers}}", user_agent: safari_ios,      matrix: { viewports: [phone] }, steps: [ { click: "[data-notifications-target=bell]" }, { click: "dialog[open] details.pwa__instructions summary" } ], covers: [pwa/_browser_settings, pwa/_system_settings, pwa/_install_instructions] }
- { id: pwa/notifications_help/firefox_mac,     as: david, path: "/rooms/{{rooms.designers}}", user_agent: firefox_mac,     steps: [ { click: "[data-notifications-target=bell]" }, { click: "dialog[open] details.notifications-help:not(.hide-in-browser) summary" } ], covers: [pwa/_browser_settings, pwa/_system_settings] }
- { id: pwa/notifications_help/firefox_windows, as: david, path: "/rooms/{{rooms.designers}}", user_agent: firefox_windows, steps: [ { click: "[data-notifications-target=bell]" }, { click: "dialog[open] details.notifications-help:not(.hide-in-browser) summary" } ], covers: [pwa/_browser_settings, pwa/_system_settings] }
- { id: pwa/notifications_help/firefox_android, as: david, path: "/rooms/{{rooms.designers}}", user_agent: firefox_android, matrix: { viewports: [phone] }, steps: [ { click: "[data-notifications-target=bell]" }, { click: "dialog[open] details.notifications-help:not(.hide-in-browser) summary" } ], covers: [pwa/_browser_settings, pwa/_system_settings, pwa/_install_instructions] }
- { id: pwa/notifications_help/opera_linux,     as: david, path: "/rooms/{{rooms.designers}}", user_agent: opera_linux,     steps: [ { click: "[data-notifications-target=bell]" }, { click: "dialog[open] details.notifications-help:not(.hide-in-browser) summary" } ], covers: [pwa/_browser_settings, pwa/_system_settings, pwa/_install_instructions] }

