# Screen inventory. Format: parity/SCREENS.md. Seeds and labels: parity/seeds/README.md.
#
# Conventions and extensions to SCREENS.md used here (the capture engine should implement them):
#
#   {{table.label}}   interpolated in path, steps, headers and request bodies from
#                     parity/.seed/<seed>/labels.json (ids, and strings like transfers.david).
#   as: <label>       sign in through /session/new with emails.<label> and passwords.all.
#   user_agent: name  a key of parity/seeds/user_agents.yml (or a literal UA string).
#   headers: {...}    extra request headers for every request of the state.
#   expect_status: N  HTTP status of the main document (default 200).
#   accept_dialogs: true  accept turbo_confirm (window.confirm) dialogs instead of dismissing them.
#   clock: advancing  the browser's Date advances with the harness's fake-time ticks instead of
#                     staying at the seed instant (timers run on fake time either way).
#   notifications: granted  the browser has notification permission and a push subscription (the
#                     default is permission denied, with no subscription).
#   kind: fragment    not a page (turbo-stream, JSON, SVG, layout-less HTML): no screenshot, compare
#                     the response (status, content type, normalized body) only.
#   request: {method, body, headers}  for fragments that aren't plain GETs.
#   mutates: true     the state changes the server's state (the database, the sign-in rate limit's
#                     counter), or its broadcasts would reach other captures (typing): each capture
#                     runs on fresh servers of its own. Visiting a room marks it read for that user
#                     (PresenceChannel#present), so states that open a room where their user has
#                     unread messages are marked too: otherwise every sidebar showing that room
#                     would depend on which captures ran first.
#   masks: {values, pixels}  values a server makes up at random while the state runs (SCREENS.md,
#                     "Masks"): each value is read from the page and becomes «name» in the text
#                     layers; pixels lists elements painted over in the screenshot.
#   Steps beyond SCREENS.md:
#     type: {selector, text}     key presses (Playwright pressSequentially), for the Lexxy editor
#     upload: {selector, files}  set files on an <input type=file>; paths are relative to the repo
#     scroll: {selector, to}     scroll an element to top|bottom
#     hold_requests: "POST **/messages"  leave matching requests pending (in-flight states)
#     goto: path                 navigate (same interpolation as path)
#
# Every state runs at the seed clock (labels clock.now) unless it says otherwise: the server under
# libfaketime/Clock, the browser under page.clock.setFixedTime.
#
# External images referenced by seeded opengraph embeds must be served by the harness (no network):
#   https://example.com/og/**                -> reference/test/fixtures/files/moon.jpg
#   https://pbs.twimg.com/profile_images/**  -> reference/test/fixtures/files/moon.jpg

# ================================================================================================
# Unauthenticated
# ================================================================================================

- id: auth/sign_in
  path: /session/new
  covers: [layouts/application, sessions/new, accounts/_help_contact]

- id: auth/sign_in/error
  path: /session/new
  expect_status: 200
  mutates: true    # each POST spends the sign-in rate limit (10 per 3 minutes per IP)
  steps:
    - fill: { selector: "#email_address", text: "david@37signals.com" }
    - fill: { selector: "#password", text: "wrong-password" }
    - click: "button[name=log_in]"
    - pause_animations_at: 500
  covers: [sessions/new, layouts/application]

- id: auth/sign_in/rate_limited
  path: /session/new
  mutates: true
  steps:
    # SessionsController rate_limit: 10 per 3 minutes, the 11th renders the rejection with 429
    - { fill: { selector: "#email_address", text: "nobody@example.com" } }
    - { fill: { selector: "#password", text: "x" } }
    - { click: "button[name=log_in]" }
    - { fill: { selector: "#password", text: "x" } }
    - { click: "button[name=log_in]" }
    - { fill: { selector: "#password", text: "x" } }
    - { click: "button[name=log_in]" }
    - { fill: { selector: "#password", text: "x" } }
    - { click: "button[name=log_in]" }
    - { fill: { selector: "#password", text: "x" } }
    - { click: "button[name=log_in]" }
    - { fill: { selector: "#password", text: "x" } }
    - { click: "button[name=log_in]" }
    - { fill: { selector: "#password", text: "x" } }
    - { click: "button[name=log_in]" }
    - { fill: { selector: "#password", text: "x" } }
    - { click: "button[name=log_in]" }
    - { fill: { selector: "#password", text: "x" } }
    - { click: "button[name=log_in]" }
    - { fill: { selector: "#password", text: "x" } }
    - { click: "button[name=log_in]" }
    - { fill: { selector: "#password", text: "x" } }
    - { click: "button[name=log_in]" }
    - pause_animations_at: 500
  covers: [sessions/new]

- id: auth/sign_in/banned_ip
  path: /session/new
  headers: { X-Forwarded-For: "{{ips.banned}}" }
  steps:
    # BlockBannedRequests only rejects non-GET requests: the form renders, the POST gets 429
    - fill: { selector: "#email_address", text: "david@37signals.com" }
    - fill: { selector: "#password", text: "{{passwords.all}}" }
    - click: "button[name=log_in]"
  covers: [sessions/new]

- id: auth/sign_in/custom_styles
  seed: custom_styles
  path: /session/new
  covers: [sessions/new, accounts/_help_contact]

- id: auth/first_run
  seed: first_run
  path: /first_run
  covers: [first_runs/show]

- id: auth/first_run/from_sign_in
  seed: first_run
  path: /session/new           # SessionsController#ensure_user_exists redirects to /first_run
  covers: [first_runs/show]

- id: auth/first_run/filled
  seed: first_run
  path: /first_run
  steps:
    - fill: { selector: "#user_name", text: "Ada Admin" }
    - fill: { selector: "#user_email_address", text: "ada@example.com" }
    - fill: { selector: "#user_password", text: "secret123456" }
  covers: [first_runs/show]

- id: auth/first_run/completed
  seed: first_run
  path: /first_run
  mutates: true
  steps:
    - fill: { selector: "#user_name", text: "Ada Admin" }
    - fill: { selector: "#user_email_address", text: "ada@example.com" }
    - fill: { selector: "#user_password", text: "secret123456" }
    - click: "button[type=submit]"
    - wait_for: "#message-area"
  # Creating the account generates a random join code (Account::Joinable#generate_join_code), which
  # the invitation shows as the join URL, its QR code link, copy and share buttons.
  masks:
    values:
      join_code: { selector: "#invite_url", attribute: value, match: "/join/([^/?#]+)$" }
    pixels: ["#invite_url", "a[href^='/qr_code/']"]
  covers: [rooms/show, rooms/show/_invitation, accounts/_invite]

- id: auth/join
  path: /join/{{join_codes.signal}}
  covers: [users/new, accounts/_help_contact]

- id: auth/join/invalid_code
  path: /join/not-a-code
  expect_status: 404
  covers: []

- id: auth/join/completed
  path: /join/{{join_codes.signal}}
  mutates: true
  steps:
    - fill: { selector: "#user_name", text: "Nora New" }
    - fill: { selector: "#user_email_address", text: "nora@example.com" }
    - fill: { selector: "#user_password", text: "secret123456" }
    - click: "button[type=submit]"
    - wait_for: "#message-area"
  covers: [rooms/show]

- id: auth/join/existing_email
  path: /join/{{join_codes.signal}}
  steps:
    # UsersController#create rescues RecordNotUnique into the sign-in form, prefilled
    - fill: { selector: "#user_name", text: "Another David" }
    - fill: { selector: "#user_email_address", text: "david@37signals.com" }
    - fill: { selector: "#user_password", text: "secret123456" }
    - click: "button[type=submit]"
    - wait_for: "#email_address"
  covers: [sessions/new]

- id: auth/transfer/valid
  path: /session/transfers/{{transfers.david}}
  mutates: true
  steps:
    - wait_for: "#message-area"   # auto-submits, signs in, lands in the last room
  covers: [sessions/transfers/show, rooms/show]

- id: auth/transfer/expired
  path: /session/transfers/{{transfers.david_expired}}
  # The form auto-submits (PUT) and the answer is a 400 with an empty body, which Turbo doesn't
  # render: the page stays as it was. Readiness waits for the submission to finish.
  covers: [sessions/transfers/show]

- id: auth/signed_out_redirect
  path: /rooms/{{rooms.designers}}   # require_authentication stores return_to and redirects
  covers: [sessions/new]

- id: auth/incompatible_browser
  user_agent: chrome_outdated
  path: /session/new
  expect_status: 200
  covers: [sessions/incompatible_browser]

- id: auth/incompatible_browser/apple_messages
  user_agent: apple_messages
  path: /session/new
  covers: [sessions/incompatible_browser]

- id: errors/404
  as: david
  path: /users/999999999
  expect_status: 404
  covers: []

- id: errors/404/static
  path: /404.html
  covers: []

- id: errors/422/static
  path: /422.html
  covers: []

- id: errors/500/static
  path: /500.html
  covers: []

- id: errors/502/static
  path: /502.html
  covers: []

