# ================================================================================================
# Interactions
# ================================================================================================

- id: interactions/actions_menu
  as: david
  path: /rooms/{{rooms.designers}}/@{{messages.plain}}
  steps:
    - hover: '[data-message-id="{{messages.plain}}"] .message__body'
    - click: '[data-message-id="{{messages.plain}}"] .message__options-btn'
    - wait_for: '[data-message-id="{{messages.plain}}"] .message__actions-menu'
  covers: [messages/_actions]

- id: interactions/actions_menu/attachment
  as: david
  path: /rooms/{{rooms.designers}}/@{{messages.image}}
  steps:
    - click: '[data-message-id="{{messages.image}}"] .message__options-btn'
    - wait_for: '[data-message-id="{{messages.image}}"] .message__actions-menu'
  covers: [messages/_actions]

- id: interactions/actions_menu/hover_only
  as: david
  path: /rooms/{{rooms.designers}}/@{{messages.plain}}
  steps:
    - hover: '[data-message-id="{{messages.plain}}"] .message__body'
  covers: [messages/_actions]

- id: interactions/boost_picker
  as: david
  path: /rooms/{{rooms.designers}}/@{{messages.unboosted}}
  # A message without boosts hides its inline .boost__action (messages.css .message__boost-inline);
  # the picker opens from "New boost" in the actions menu.
  steps:
    - click: '[data-message-id="{{messages.unboosted}}"] .message__options-btn'
    - click: '[data-message-id="{{messages.unboosted}}"] .message__boost-btn'
    - wait_for: '[data-message-id="{{messages.unboosted}}"] input.input--boost'
  covers: [messages/boosts/new]

- id: interactions/boost_picker/filled
  as: david
  path: /rooms/{{rooms.designers}}/@{{messages.unboosted}}
  steps:
    - click: '[data-message-id="{{messages.unboosted}}"] .message__options-btn'
    - click: '[data-message-id="{{messages.unboosted}}"] .message__boost-btn'
    - fill: { selector: '[data-message-id="{{messages.unboosted}}"] input.input--boost', text: "Great!" }
  covers: [messages/boosts/new]

- id: interactions/boost_picker/cancelled
  as: david
  path: /rooms/{{rooms.designers}}/@{{messages.unboosted}}
  steps:
    - click: '[data-message-id="{{messages.unboosted}}"] .message__options-btn'
    - click: '[data-message-id="{{messages.unboosted}}"] .message__boost-btn'
    - wait_for: '[data-message-id="{{messages.unboosted}}"] input.input--boost'
    - press: "Escape"
    - wait_for: '[data-message-id="{{messages.unboosted}}"]:not(:has(input.input--boost))'
  covers: [messages/boosts/index, messages/boosts/_boosts]

- id: interactions/boost_created
